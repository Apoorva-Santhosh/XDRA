name: CI

# Runs on every PR targeting main, and on direct pushes to main (as a safety net).
# Branch protection (see docs/BRANCH_PROTECTION_SETUP.md) is configured to require
# the "lint" and "test" jobs below to pass before a PR can be merged — this is
# what actually enforces "no bugs, no merge." This file alone does not block
# merges; it only produces the checks that branch protection then requires.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install black ruff

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (ruff)
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing

  schema-contract:
    name: schema-contract
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run schema contract tests only
        run: pytest tests/allocation/test_schema.py -v
